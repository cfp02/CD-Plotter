[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_ESP32_DEVKIT
    -DDRIVER_TB6612

lib_deps = 
    waspinator/AccelStepper@^1.64
    madhephaestus/ESP32Servo@^3.0.5

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_XIAO_ESP32S3
    -DDRIVER_TMC2209

lib_deps = 
    teemuatlut/TMCStepper@^0.7.3
    madhephaestus/ESP32Servo@^3.0.5
    ; Note: TMC2209 driver implementation pending