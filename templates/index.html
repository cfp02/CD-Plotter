<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Plotter – Stippling Web UI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem 2rem;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 0;
    }

    .panel {
      background: white;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .col {
      flex: 1 1 280px;
      min-width: 260px;
    }

    label {
      display: block;
      margin: 0.4rem 0 0.1rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.3rem 0.4rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }

    textarea {
      min-height: 4rem;
      resize: vertical;
    }

    input[type="range"] {
      width: 100%;
    }

    .checkbox-inline {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.3rem;
    }

    button {
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: none;
      background: #1976d2;
      color: white;
      font-size: 0.9rem;
      margin-right: 0.5rem;
    }

    button.secondary {
      background: #555;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .preview-box {
      flex: 1 1 280px;
      min-width: 260px;
      background: #fafafa;
      border-radius: 6px;
      padding: 0.5rem;
      border: 1px solid #ddd;
    }

    .preview-box h3 {
      margin-top: 0;
      font-size: 0.95rem;
    }

    .preview-box img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: white;
    }

    #status {
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    small {
      color: #666;
    }
  </style>
</head>
<body>
  <h1>ESP32 Plotter – Stippling Generator</h1>

  <div class="panel">
    <div class="row">
      <div class="col">
        <label for="esp32_ip">ESP32 IP Address</label>
        <input type="text" id="esp32_ip" value="192.168.1.185">

        <label>Input Image</label>
        <input type="file" id="image" accept="image/*">

        <label for="text">Or Text</label>
        <textarea id="text" placeholder="Type text here (optional)"></textarea>
        <small>If both image and text are provided, the image wins.</small>
      </div>

      <div class="col">
        <label for="dot_spacing_mm">Dot Spacing (mm)</label>
        <input type="range" id="dot_spacing_mm" min="0.1" max="3.0" step="0.05" value="0.5">
        <input type="number" id="dot_spacing_val" min="0.1" max="3.0" step="0.05" value="0.5">

        <label for="pen_size_mm">Pen Dot Size (mm)</label>
        <input type="range" id="pen_size_mm" min="0.1" max="2.0" step="0.05" value="0.3">
        <input type="number" id="pen_size_val" min="0.1" max="2.0" step="0.05" value="0.3">

        <label for="contrast">Contrast</label>
        <input type="range" id="contrast" min="0.5" max="2.0" step="0.05" value="1.0">
        <input type="number" id="contrast_val" min="0.5" max="2.0" step="0.05" value="1.0">

        <label for="brightness">Brightness</label>
        <input type="range" id="brightness" min="0.5" max="1.5" step="0.05" value="1.0">
        <input type="number" id="brightness_val" min="0.5" max="1.5" step="0.05" value="1.0">

        <div class="checkbox-inline">
          <input type="checkbox" id="invert">
          <label for="invert" style="margin: 0;">Invert (dark on light)</label>
        </div>

        <label for="text_size">Text Size (px for render)</label>
        <input type="range" id="text_size" min="20" max="200" step="5" value="120">
        <input type="number" id="text_size_val" min="20" max="200" step="5" value="120">
      </div>

      <div class="col">
        <label for="mode">Stippling Mode</label>
        <select id="mode">
          <option value="binary">Binary (Floyd–Steinberg)</option>
          <option value="density" selected>Density (multi-pass)</option>
          <option value="blue_noise">Blue Noise (Poisson)</option>
        </select>

        <label for="max_passes">Layer Passes (full sweeps)</label>
        <input type="number" id="max_passes" min="1" max="5" step="1" value="1">

        <label for="jitter">Jitter (fraction of spacing)</label>
        <input type="number" id="jitter" min="0" max="1" step="0.05" value="0.3">

        <label for="min_spacing_mm">Min Spacing (mm, blue-noise)</label>
        <input type="number" id="min_spacing_mm" min="0.1" max="3.0" step="0.05" value="0.35">

        <label for="dot_budget">Dot Budget (blue-noise)</label>
        <input type="number" id="dot_budget" min="1000" max="50000" step="1000" value="12000">

        <div style="margin-top: 0.8rem;">
          <button id="generate_btn">Generate Pattern</button>
        </div>

        <div style="margin-top: 0.8rem;">
          <button id="send_btn" class="secondary">Send to Plotter</button>
          <button id="home_btn" class="secondary">Home Plotter</button>
        </div>

        <div id="status"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="preview-container">
      <div class="preview-box">
        <h3>Original</h3>
        <img id="preview_original" src="" alt="Original preview">
      </div>
      <div class="preview-box">
        <h3>Stipple Preview</h3>
        <img id="preview_stipple" src="" alt="Stipple preview">
      </div>
      <div class="preview-box">
        <h3>Processed (contrast/brightness)</h3>
        <img id="preview_processed" src="" alt="Processed preview">
      </div>
      <div class="preview-box">
        <h3>Tone Map (binary/density)</h3>
        <img id="preview_tone" src="" alt="Tone map preview">
      </div>
      <div class="preview-box">
        <h3>Dot Overlay (hi-res)</h3>
        <img id="preview_overlay" src="" alt="Dot overlay preview">
      </div>
    </div>
    <div style="margin-top: 0.5rem;">
      <span id="dot_count"></span>
    </div>
  </div>

  <script>
    // Sync sliders and numeric inputs
    function bindSliderAndNumber(sliderId, numberId) {
      const slider = document.getElementById(sliderId);
      const number = document.getElementById(numberId);

      slider.addEventListener("input", () => {
        number.value = slider.value;
      });
      number.addEventListener("input", () => {
        slider.value = number.value;
      });
    }

    bindSliderAndNumber("dot_spacing_mm", "dot_spacing_val");
    bindSliderAndNumber("pen_size_mm", "pen_size_val");
    bindSliderAndNumber("contrast", "contrast_val");
    bindSliderAndNumber("brightness", "brightness_val");
    bindSliderAndNumber("text_size", "text_size_val");

    const statusEl = document.getElementById("status");
    const dotCountEl = document.getElementById("dot_count");
    const previewOriginalEl = document.getElementById("preview_original");
    const previewStippleEl = document.getElementById("preview_stipple");
    const previewProcessedEl = document.getElementById("preview_processed");
    const previewToneEl = document.getElementById("preview_tone");
    const previewOverlayEl = document.getElementById("preview_overlay");
    const generateBtn = document.getElementById("generate_btn");
    const sendBtn = document.getElementById("send_btn");
    const homeBtn = document.getElementById("home_btn");

    function setStatus(msg, isError=false) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? "#c62828" : "#333";
    }

    // -------------------------------------------------------------------
    // Generate pattern
    // -------------------------------------------------------------------
    generateBtn.addEventListener("click", async () => {
      const esp32_ip = document.getElementById("esp32_ip").value.trim();
      const dot_spacing_mm = document.getElementById("dot_spacing_mm").value;
      const pen_size_mm = document.getElementById("pen_size_mm").value;
      const contrast = document.getElementById("contrast").value;
      const brightness = document.getElementById("brightness").value;
      const invert = document.getElementById("invert").checked;
      const text = document.getElementById("text").value;
      const text_size = document.getElementById("text_size").value;
      const mode = document.getElementById("mode").value;
      const max_passes = document.getElementById("max_passes").value;
      const jitter = document.getElementById("jitter").value;
      const min_spacing_mm = document.getElementById("min_spacing_mm").value;
      const dot_budget = document.getElementById("dot_budget").value;

      const imageInput = document.getElementById("image");
      const file = imageInput.files[0];

      const formData = new FormData();
      formData.append("esp32_ip", esp32_ip);
      formData.append("dot_spacing_mm", dot_spacing_mm);
      formData.append("pen_size_mm", pen_size_mm);
      formData.append("contrast", contrast);
      formData.append("brightness", brightness);
      formData.append("invert", invert ? "true" : "false");
      formData.append("text_size", text_size);
      formData.append("mode", mode);
      formData.append("max_passes", max_passes);
      formData.append("jitter", jitter);
      formData.append("min_spacing_mm", min_spacing_mm);
      formData.append("dot_budget", dot_budget);

      if (file) {
        formData.append("image", file);
      }
      if (text.trim().length > 0) {
        formData.append("text", text);
      }

      setStatus("Generating pattern...");
      generateBtn.disabled = true;
      sendBtn.disabled = true;

      try {
        const resp = await fetch("/generate", {
          method: "POST",
          body: formData
        });

        if (!resp.ok) {
          const text = await resp.text();
          setStatus(`Error from server: ${text}`, true);
        } else {
          const data = await resp.json();
          if (!data.success) {
            setStatus(data.error || "Generation failed.", true);
          } else {
            setStatus("Pattern generated.");
            dotCountEl.textContent = `Dots: ${data.dots_count}`;

            if (data.preview_original) {
              previewOriginalEl.src = "data:image/png;base64," + data.preview_original;
            }
            if (data.preview_processed) {
              previewProcessedEl.src = "data:image/png;base64," + data.preview_processed;
            }
            if (data.preview_tone) {
              previewToneEl.src = "data:image/png;base64," + data.preview_tone;
            }
            if (data.preview_overlay) {
              previewOverlayEl.src = "data:image/png;base64," + data.preview_overlay;
            }
            if (data.preview_stipple) {
              previewStippleEl.src = "data:image/png;base64," + data.preview_stipple;
            }

            sendBtn.disabled = false;
          }
        }
      } catch (err) {
        console.error(err);
        setStatus("Error talking to server (see console).", true);
      } finally {
        generateBtn.disabled = false;
      }
    });

    // -------------------------------------------------------------------
    // Send to plotter
    // -------------------------------------------------------------------
    sendBtn.addEventListener("click", async () => {
      const esp32_ip = document.getElementById("esp32_ip").value.trim();
      const dot_spacing_mm = document.getElementById("dot_spacing_mm").value;

      setStatus("Sending to plotter...");
      sendBtn.disabled = true;

      try {
        const resp = await fetch("/send", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            esp32_ip,
            dot_spacing_mm
          })
        });

        const data = await resp.json();
        if (!data.success) {
          setStatus(data.error || "Send failed.", true);
        } else {
          setStatus(data.message || "Pattern sent.");
        }
      } catch (err) {
        console.error(err);
        setStatus("Error talking to server while sending.", true);
      } finally {
        sendBtn.disabled = false;
      }
    });

    // -------------------------------------------------------------------
    // Home plotter
    // -------------------------------------------------------------------
    homeBtn.addEventListener("click", async () => {
      const esp32_ip = document.getElementById("esp32_ip").value.trim();

      setStatus("Sending home command...");
      homeBtn.disabled = true;

      try {
        const resp = await fetch("/home", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ esp32_ip })
        });

        const data = await resp.json();
        if (!data.success) {
          setStatus(data.error || "Home failed.", true);
        } else {
          setStatus(data.message || "Homing command sent.");
        }
      } catch (err) {
        console.error(err);
        setStatus("Error talking to server while homing.", true);
      } finally {
        homeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
